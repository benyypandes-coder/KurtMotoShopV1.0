name: Build Kurt MotoShop V1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Searching for Gradle project..."

          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check project
        run: |
          cd "$PROJECT_DIR"
          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Create Gradle Wrapper if missing
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Creating wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-MotoShop-V1-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
